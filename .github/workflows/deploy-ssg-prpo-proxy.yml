name: Deploy authorised ssg-prpo-proxy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested commit SHA to deploy
        required: true
        type: string

concurrency:
  group: deploy-ssg-prpo-proxy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify exact source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test package
        run: |
          npm install --omit=dev
          npm run build --if-present
          npm run test --if-present

      - name: Login to Azure for ssg-prpo-proxy
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2ABB4E6A360340E2B15C4FE614FA12FA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FA4AC7E0200244329CD2C296F17440C6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_578BC57741E045108151C85DDB76A714 }}

      - name: Deploy exact package to ssg-prpo-proxy
        uses: Azure/functions-action@v1
        with:
          app-name: ssg-prpo-proxy
          slot-name: Production
          package: .
